# ---------------------------------------------------------------------------
# The `h2` profile: run the whole application with no external database.
#
#   ./gradlew bootRun --args='--spring.profiles.active=h2'
#
# Local development only. H2 is a `developmentOnly` dependency, so it is not in
# the deployed jar and this profile cannot be activated in the image.
# ---------------------------------------------------------------------------
server:
  port: 8088
  forward-headers-strategy: framework

spring:
  datasource:
    # File-backed rather than jdbc:h2:mem, so the seeded accounts and anything
    # you sign up survive a restart. Delete ./data to start clean.
    # MODE=PostgreSQL keeps the SQL dialect close to the real target, so schema
    # behaviour here is a reasonable rehearsal for Postgres.
    url: jdbc:h2:file:./data/h2/appdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      # http://localhost:8088/h2-console
      # Reachable without a token, and only because this profile exists solely
      # for a laptop - H2ConsoleSecurityConfig is @Profile("h2") and so does not
      # exist under dev or prod. A database console on a public URL would expose
      # the schema, the data and arbitrary SQL with no login at all.
      enabled: true
      path: /h2-console
      settings:
        # Localhost only. Even on a dev machine there is no reason for this to
        # answer requests from the network.
        web-allow-others: false

  jpa:
    hibernate:
      # `update` rather than create-drop: the file persists, so the schema
      # should evolve with it rather than being rebuilt on every boot.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

jwt:
  # A known key, and deliberately so: this profile is a throwaway local database,
  # and requiring a secret would defeat the point of a zero-setup run. JWT_SECRET
  # still wins when set. Nothing signed here is worth anything anywhere else, and
  # the string says so.
  secret: ${JWT_SECRET:h2-profile-local-development-only-not-a-real-secret}

app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173"
    max-age: 3600
  seed:
    enabled: true
  refresh-token-cleanup:
    cron: "0 */30 * * * *"

logging:
  level:
    root: INFO
    com.spring.app: DEBUG
    org.hibernate.SQL: DEBUG
    # Never TRACE: that logger prints every bound parameter, which on a signup
    # means the BCrypt hash.
    org.hibernate.orm.jdbc.bind: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

file:
  server-path: ./data/uploads/
  client-path: /api/v1/image
  base-url: http://localhost:8088${file.client-path}
