server:
  # PORT is what Render (and most PaaS) inject and expect the process to bind. SERVER_PORT
  # stays as a fallback so a plain `java -jar` deployment behaves as before.
  port: ${PORT:${SERVER_PORT:8088}}
  forward-headers-strategy: framework

spring:
  datasource:
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
    # No credential defaults: a production deployment that has not been given credentials
    # should fail to start, not fall back to something guessable.
    #
    # DB_URL wins when set. Otherwise the JDBC URL is composed from the parts a managed
    # database exposes - Render, RDS and friends publish host/port/name separately, and the
    # "connection string" they provide is a postgres:// URI that the JDBC driver will not accept.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
      file-size-threshold: 2KB

  jpa:
    hibernate:
      # Schema changes belong in reviewed migrations, not in application startup.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    max-age: 3600
  seed:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        # Health only. The other actuator endpoints describe the innards of the process
        # (env, beans, mappings, heap dumps) and have no business being reachable.
        include: health
  endpoint:
    health:
      # Liveness, not a status page: "UP" without naming the components behind it.
      show-details: never
      show-components: never

logging:
  level:
    root: WARN
    com.spring.app: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

springdoc:
  swagger-ui:
    # Interactive docs are a development tool. Serving them in production
    # publishes the full shape of the API, including which endpoints exist.
    enabled: ${SWAGGER_UI_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_API_DOCS_ENABLED:false}

file:
  server-path: ${FILE_SERVER_PATH:/var/lib/spring-app/uploads/}
  client-path: /api/v1/image
  base-url: ${FILE_BASE_URL}${file.client-path}
