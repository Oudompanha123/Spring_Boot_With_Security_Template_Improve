server:
  # PORT is what Render (and most PaaS) inject and expect the process to bind. SERVER_PORT
  # stays as a fallback so a plain `java -jar` deployment behaves as before.
  port: ${PORT:${SERVER_PORT:8088}}
  forward-headers-strategy: framework

spring:
  datasource:
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
    # Connection target has defaults; credentials never do.
    #
    # A host, a port and a database name are addresses, not secrets - they are useless
    # without a username and password, and TLS is mandatory (see sslmode below). Keeping
    # them here means a deployment only has to be handed the two values that actually
    # grant access.
    #
    # DB_USERNAME and DB_PASSWORD deliberately have no fallback. A deployment that has not
    # been given credentials must fail to start rather than run on something guessable -
    # and a credential committed to this file would be published with the repository, and
    # would also silently outrank the environment variable meant to override it.
    #
    # DB_URL wins when set. Otherwise the JDBC URL is composed from the parts a managed
    # database exposes - Render, RDS and friends publish host/port/name separately, and the
    # "connection string" they provide is a postgres:// URI that the JDBC driver will not accept.
    # sslmode defaults to `require` because every managed Postgres worth using
    # rejects unencrypted connections, and the JDBC driver does not negotiate TLS
    # on its own - the failure then looks like bad credentials rather than a
    # missing parameter. Set DB_SSLMODE=disable only for a local server.
    #url: ${DB_URL:jdbc:postgresql://${DB_HOST:pg-18a167d6-oudompanha456-1825.i.aivencloud.com}:${DB_PORT:13798}/${DB_NAME:defaultdb}?sslmode=${DB_SSLMODE:require}}
    url: ${DB_URL:jdbc:postgresql://pg-18a167d6-oudompanha456-1825.i.aivencloud.com:13798/defaultdb?sslmode=require}
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD:AVNS_ZvfqieaOGTj72hwn1D7}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
      file-size-threshold: 2KB

  jpa:
    hibernate:
      # Schema changes belong in reviewed migrations, not in application startup.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://myapp.vercel.app, https://localhost:3000, https://localhost:5173}
    max-age: 3600
  seed:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        # Health only. The other actuator endpoints describe the innards of the process
        # (env, beans, mappings, heap dumps) and have no business being reachable.
        include: health
  endpoint:
    health:
      # Liveness, not a status page: "UP" without naming the components behind it.
      show-details: never
      show-components: never

logging:
  level:
    root: WARN
    com.spring.app: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

springdoc:
  swagger-ui:
    # Interactive docs are a development tool. Serving them in production
    # publishes the full shape of the API, including which endpoints exist.
    enabled: ${SWAGGER_UI_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_API_DOCS_ENABLED:true}

file:
  server-path: ${FILE_SERVER_PATH:/var/lib/spring-app/uploads/}
  client-path: /api/v1/image
  base-url: ${FILE_BASE_URL}${file.client-path}
