server:
  port: ${SERVER_PORT:8088}
  forward-headers-strategy: framework

spring:
  datasource:
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
    # No defaults: a production deployment that has not been given credentials
    # should fail to start, not fall back to something guessable.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
      file-size-threshold: 2KB

  jpa:
    hibernate:
      # Schema changes belong in reviewed migrations, not in application startup.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    max-age: 3600
  seed:
    enabled: false

logging:
  level:
    root: WARN
    com.spring.app: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

springdoc:
  swagger-ui:
    # Interactive docs are a development tool. Serving them in production
    # publishes the full shape of the API, including which endpoints exist.
    enabled: ${SWAGGER_UI_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_API_DOCS_ENABLED:false}

file:
  server-path: ${FILE_SERVER_PATH:/var/lib/spring-app/uploads/}
  client-path: /api/v1/image
  base-url: ${FILE_BASE_URL}${file.client-path}
