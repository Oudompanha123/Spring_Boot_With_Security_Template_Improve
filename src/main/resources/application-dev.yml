server:
  port: 8088
  forward-headers-strategy: framework

spring:
  datasource:
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
    # Credentials come from the environment. The fallbacks are local-development
    # conveniences; the committed password that used to live here should be treated
    # as compromised and rotated (it is still in this repository's git history).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
      file-size-threshold: 2KB

  jpa:
    hibernate:
      # Fine for local iteration. Real environments want `validate` plus a
      # migration tool (Flyway/Liquibase) so schema changes are reviewable.
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        jdbc:
          time_zone: UTC

# CORS
app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:3001"
    max-age: 3600
  # Creates the MANAGER and ADMIN accounts that signup deliberately cannot create.
  # Override the passwords, or leave this off, anywhere that is not a laptop.
  seed:
    enabled: true
    admin-email: admin@example.com
    manager-email: manager@example.com
    user-email: user@example.com

logging:
  level:
    root: INFO
    com.spring.app: DEBUG
    # SQL statements are useful and contain no values.
    org.hibernate.SQL: DEBUG
    # Bound parameters are NOT enabled. At TRACE this logger prints every value
    # sent to the database, which on a signup means the BCrypt hash and on a
    # login lookup the email - exactly what must never reach a log file.
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.orm.jdbc.extract: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

file:
  server-path: D:/upload-files/
  client-path: /api/v1/image
  base-url: http://localhost:8088${file.client-path}
