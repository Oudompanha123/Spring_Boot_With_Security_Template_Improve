# Render blueprint: one web service plus a managed Postgres.
#
# Deploy: push this file, then in Render choose New -> Blueprint and point it at
# the repository. Render will ask for the two values marked `sync: false` and
# generate JWT_SECRET itself.
#
# Everything the prod profile requires is set here. That profile deliberately
# has no fallbacks for credentials, so a missing variable is a failed startup
# rather than a service running on a guessable default - which means this file
# has to be complete.

databases:
  - name: spring-app-db
    databaseName: spring_app
    user: spring_app
    plan: free

services:
  - type: web
    name: spring-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Generated by Render and never shown in the repository. Rotating it
      # invalidates every live token, which is the intended behaviour.
      - key: JWT_SECRET
        generateValue: true

      # A managed database publishes its parts separately. Note that Render's
      # `connectionString` is a postgres:// URI, which the JDBC driver will not
      # accept - hence host/port/database rather than the connection string, and
      # application-prod.yml composes the jdbc: URL from them.
      - key: DB_HOST
        fromDatabase:
          name: spring-app-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: spring-app-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: spring-app-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: spring-app-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: spring-app-db
          property: password

      # The prod profile sets ddl-auto=validate, which fails against an empty
      # database because there is nothing to validate. `update` lets the first
      # deploy create the schema.
      #
      # This is a bootstrap convenience, not a way to run a service. Hibernate
      # will add columns and never remove or alter them, so the schema quietly
      # diverges from the entities and no change is ever reviewed. Introduce
      # Flyway and set this back to `validate` before the data matters.
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

      # Asked for at deploy time rather than committed.
      #
      # CORS_ALLOWED_ORIGINS: the exact origins of your frontend, comma
      # separated (e.g. https://app.example.com). Not "*" - the API sends
      # credentials, and allowing every origin with credentials is how a token
      # ends up readable by any site the user visits.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # FILE_BASE_URL: this service's own public URL, e.g.
      # https://spring-app.onrender.com - only used to build image links.
      - key: FILE_BASE_URL
        sync: false

      # Uploads land on the container filesystem, which is recreated on every
      # deploy and on every restart. Fine for a demo; anything that must survive
      # needs object storage (S3/R2) or a Render disk.
      - key: FILE_SERVER_PATH
        value: /tmp/uploads/

      # Interactive docs are off in prod by default. Flip these to true if you
      # want to click through Swagger on the deployed instance, remembering that
      # it publishes the full shape of the API.
      - key: SWAGGER_UI_ENABLED
        value: "false"
      - key: SWAGGER_API_DOCS_ENABLED
        value: "false"
