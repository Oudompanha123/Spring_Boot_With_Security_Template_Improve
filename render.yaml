# Render blueprint: one web service plus a managed Postgres.
#
# Deploy: push this file, then in Render choose New -> Blueprint and point it at
# the repository. Render will ask for the four values marked `sync: false` and
# generate JWT_SECRET itself.
#
# Everything the prod profile requires is set here. That profile deliberately
# has no fallbacks for credentials, so a missing variable is a failed startup
# rather than a service running on a guessable default - which means this file
# has to be complete.

services:
  - type: web
    name: spring-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Generated by Render and never shown in the repository. Rotating it
      # invalidates every live token, which is the intended behaviour.
      - key: JWT_SECRET
        generateValue: true

      # The database is Aiven, not a Render resource, so there is nothing to wire
      # `fromDatabase` to. Host, port and database name are defaulted in
      # application-prod.yml - they are addresses, not secrets.
      #
      # Only the credentials are asked for, and only because they grant access.
      # `sync: false` means Render prompts once and stores the value itself,
      # instead of it living in this file and therefore in the repository.
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # No SPRING_JPA_HIBERNATE_DDL_AUTO here on purpose. The prod profile uses
      # ddl-auto=validate and the Aiven schema already exists, so Hibernate checks
      # it and starts. Setting `update` would let the schema drift silently instead
      # of failing when the entities and the database disagree.

      # Asked for at deploy time rather than committed.
      #
      # CORS_ALLOWED_ORIGINS: the exact origins of your frontend, comma
      # separated (e.g. https://app.example.com). Not "*" - the API sends
      # credentials, and allowing every origin with credentials is how a token
      # ends up readable by any site the user visits.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # FILE_BASE_URL: this service's own public URL, e.g.
      # https://spring-app.onrender.com - only used to build image links.
      - key: FILE_BASE_URL
        sync: false

      # /app/data is the directory the Dockerfile creates and hands to the
      # non-root user. It is still container-local: recreated on every deploy and
      # restart, so uploads do not survive. Anything that must needs object
      # storage (S3/R2) or a mounted disk.
      - key: FILE_SERVER_PATH
        value: /app/data/uploads/

      # Interactive docs are off in prod by default. Flip these to true if you
      # want to click through Swagger on the deployed instance, remembering that
      # it publishes the full shape of the API.
      - key: SWAGGER_UI_ENABLED
        value: "false"
      - key: SWAGGER_API_DOCS_ENABLED
        value: "false"
